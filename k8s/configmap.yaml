apiVersion: v1
kind: ConfigMap
metadata:
  name: qa-config
  namespace: qa-automation
  labels:
    app: playwright-tests
    tier: testing
data:
  # Application URLs
  base-url: "https://www.saucedemo.com"
  api-base-url: "https://jsonplaceholder.typicode.com"
  
  # Test Configuration
  test-timeout: "30000"
  navigation-timeout: "30000"
  
  # Logging
  log-level: "info"
  
  # Report Configuration
  report-format: "html,json"
  
  # Retry Configuration
  max-retries: "2"
  retry-delay: "1000"

---
apiVersion: v1
kind: Secret
metadata:
  name: qa-credentials
  namespace: qa-automation
  labels:
    app: playwright-tests
    tier: testing
type: Opaque
data:
  # Base64 encoded credentials (update with your actual values)
  # echo -n "value" | base64
  api-key: "YXBpLWtleS1oZXJl"
  test-user-password: "cGFzc3dvcmQtaGVyZQ=="
