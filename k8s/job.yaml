# This directory is a plain manifest set (no Chart.yaml/templates), so this
# Job is meant to be launched with `kubectl create -f k8s/job.yaml` for each
# manual run - generateName lets the API server assign a unique name per
# creation. `kubectl apply` doesn't fit a generateName resource (there's no
# fixed name to diff against) and a Job's spec is immutable after creation
# anyway, so a second `apply` with the same name would fail outright.
#
# This used to be a Deployment, which is the wrong resource kind for this
# container: it runs `npm run test` once and exits, but a Deployment's
# restartPolicy is always Always, so Kubernetes kept restarting it forever
# after every run (confirmed live: 2 restarts within the first 2 minutes).
# livenessProbe/readinessProbe checked for /results/.ready and /results/.health
# marker files nothing in this suite ever writes, so the pod could never
# report Ready either. A Job (like the CronJob right below, which was already
# correct) is the right fit - run to completion, no probes needed.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: playwright-tests-
  namespace: qa-automation
  labels:
    app: playwright-tests
    tier: testing
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: playwright-tests
        tier: testing
    spec:
      serviceAccountName: playwright-tests
      restartPolicy: OnFailure
      containers:
      - name: playwright
        image: qa-typescript-tests:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: CI
          value: "true"
        - name: BASE_URL
          valueFrom:
            configMapKeyRef:
              name: qa-config
              key: base-url
        - name: API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: qa-config
              key: api-base-url
        - name: HEADLESS
          value: "true"
        - name: REPORT_DIR
          value: "/results"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "1000m"
        volumeMounts:
        - name: results
          mountPath: /results
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: results
        emptyDir: {}
      - name: config
        configMap:
          name: qa-config
      nodeSelector:
        workload: testing

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: playwright-tests-scheduled
  namespace: qa-automation
spec:
  # Run tests daily at 2 AM UTC
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: playwright-tests
            tier: testing
        spec:
          serviceAccountName: playwright-tests
          containers:
          - name: playwright
            image: qa-typescript-tests:latest
            imagePullPolicy: IfNotPresent
            env:
            - name: CI
              value: "true"
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: qa-config
                  key: base-url
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: qa-config
                  key: api-base-url
            - name: HEADLESS
              value: "true"
            - name: REPORT_DIR
              value: "/results"
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "3Gi"
                cpu: "1000m"
            volumeMounts:
            - name: results
              mountPath: /results
          volumes:
          - name: results
            emptyDir: {}
          restartPolicy: OnFailure
          nodeSelector:
            workload: testing
      backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
