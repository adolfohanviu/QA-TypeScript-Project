apiVersion: v1
kind: Service
metadata:
  name: playwright-tests
  namespace: qa-automation
  labels:
    app: playwright-tests
    tier: testing
spec:
  type: ClusterIP
  selector:
    app: playwright-tests
  ports:
  - name: http
    port: 80
    targetPort: 3333
    protocol: TCP

# A report-server Service (matching docker-compose.yml's report-server
# service - a simple http-server exposing /results on :3333) belongs here
# once there's a k8s Deployment for it. There isn't one yet, so it's left
# out rather than shipping a Service with no backing Pods.
